<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Availability</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. The code -->
<div id="gate" class="gate">
  <form id="gateForm" class="card" autocomplete="off">
    <div class="dots" aria-hidden="true"><i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i></div>
    <h1 id="gateTitle">Availability</h1>
    <p>Type your code to open your calendar.</p>
    <input id="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false"
           placeholder="Your code" aria-label="Your code" enterkeyhint="go">
    <p id="gateError" class="error" role="alert"></p>
    <button class="primary" type="submit">Open</button>
  </form>
</div>

<!-- 2. The calendar -->
<main id="app" hidden>
  <header>
    <div>
      <p class="hello">Hi <b id="who"></b></p>
      <h2>When are you available?</h2>
    </div>
    <button id="leave" class="link" type="button">Not you?</button>
  </header>

  <p class="hint"><b>Swipe</b> across days to paint them. <b>Tap</b> a weekday (Mon, Tue…) for its whole column.</p>

  <nav class="month">
    <button id="prev" type="button" aria-label="Previous month">‹</button>
    <h3 id="monthName" aria-live="polite"></h3>
    <button id="next" type="button" aria-label="Next month">›</button>
  </nav>

  <div id="weekdays" class="weekdays"></div>
  <div id="grid" class="grid" role="grid"></div>

  <label class="note">
    <span>Anything to add? (optional)</span>
    <textarea id="note" rows="2" maxlength="500" placeholder="e.g. only after 4 pm on the 12th"></textarea>
  </label>
</main>

<footer id="bar" hidden>
  <div class="count"><b id="count">0</b> <span id="countLabel">days</span><button id="clear" class="link" type="button">Clear</button></div>
  <button id="send" class="primary" type="button">Send</button>
  <p id="sendError" class="error" role="alert"></p>
</footer>

<!-- 3. Sent -->
<div id="done" class="gate" hidden>
  <div class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Sent</h1>
    <p id="doneText"></p>
    <button id="again" class="primary" type="button">Change my days</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
