<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Availability</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <div>
      <p id="hello" class="hello">Who is available, and when</p>
      <h1 id="title">Availability</h1>
    </div>
    <button id="leave" class="link" type="button" hidden>Not you?</button>
  </header>

  <!-- Who is on the calendar: a colour, a name and their days in words -->
  <ul id="legend" class="legend"></ul>

  <p id="hint" class="hint" hidden><b>Swipe sideways</b> across days to paint yours. Swipe over painted days to remove them. <b>Tap</b> a weekday (Mon, Tue…) for its whole column.</p>

  <!-- The months are drawn here -->
  <div id="months"></div>

  <label id="noteBox" class="note" hidden>
    <span>Anything to add? (optional)</span>
    <textarea id="note" rows="2" maxlength="500" placeholder="e.g. only after 4 pm on the 12th"></textarea>
  </label>
</main>

<footer>
  <!-- Before the code -->
  <div id="barOut" class="bar">
    <span class="soft">Add your own days</span>
    <button id="join" class="primary" type="button">I have a code</button>
  </div>
  <!-- After the code -->
  <div id="barIn" class="bar" hidden>
    <div class="count"><b id="count">0</b> <span id="countLabel" class="soft">days</span><button id="clear" class="link" type="button">Clear</button></div>
    <button id="send" class="primary" type="button">Send</button>
  </div>
  <p id="sendError" class="error" role="alert"></p>
</footer>

<!-- The code -->
<div id="gate" class="gate" hidden>
  <form id="gateForm" class="card" autocomplete="off">
    <h2>Your code</h2>
    <p>Type your code to add or change your days.</p>
    <input id="code" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="Your code" aria-label="Your code" enterkeyhint="go">
    <p id="gateError" class="error" role="alert"></p>
    <button class="primary" type="submit">Open</button>
    <button id="gateClose" class="link" type="button">Just looking</button>
  </form>
</div>

<!-- Sent -->
<div id="done" class="gate" hidden>
  <div class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h2>Sent</h2>
    <p id="doneText"></p>
    <button id="again" class="primary" type="button">Back to the calendar</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
