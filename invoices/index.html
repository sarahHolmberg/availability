<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>:fouR · invoices</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap">
<style>
  /* The invoices page: one sentence, the rest still empty. Same quiet look as the landing page. */
  :root { --bg: #000; --ink: #fff; --soft: #8a8a8a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink);
    font: 500 12px/1.4 Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }
  header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; }
  .logo { color: var(--ink); text-decoration: none; font-weight: 800; font-size: 28px; letter-spacing: -.055em; }
  .tag { font-size: 11px; font-weight: 600; padding: .38em .95em .42em; background: var(--ink); color: var(--bg); }
  main { padding: 18vh 24px 80px; max-width: 980px; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(26px, 5.2vw, 64px); line-height: 1.08; letter-spacing: -.035em; animation: in 1.2s cubic-bezier(.2, .7, .1, 1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  @media (min-width: 720px) { header { padding: 36px 40px; } main { padding-left: 40px; padding-right: 40px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/" aria-label=":fouR home">:fouR</a>
  <span class="tag">invoices</span>
</header>
<main>
  <h1>This is how we handle our invoices for our dancers.</h1>
  <!-- The rest comes later -->
</main>
</body>
</html>
