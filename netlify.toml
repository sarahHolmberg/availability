[build]
  publish = "."
  functions = "netlify/functions"

# Short addresses: /invoice and /contracts go to their pages
[[redirects]]
  from = "/invoice"
  to = "/invoices/"
  status = 301

[[redirects]]
  from = "/contracts"
  to = "/contract-signer/"
  status = 301

# The contract signer stores signed contracts at /api/contract
[[redirects]]
  from = "/api/contract"
  to = "/.netlify/functions/contract"
  status = 200

# The roadmap talks to /api (shorter than /.netlify/functions/road)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/road"
  status = 200

# The page and its files: always the newest version
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
