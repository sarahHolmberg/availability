<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>:fouR · roadmap</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/roadmap/style.css">
</head>
<body>

<!-- The main page: the road to the dance meet -->
<main>
  <header>
    <h1 id="title">:fouR</h1>
    <p id="sub" class="soft"></p>
    <p id="dataError" class="error" role="alert"></p>
    <!-- Where we are now: tap it to jump to that step -->
    <button id="now" class="nowCard" type="button"></button>
  </header>
  <div class="mapBox">
    <svg id="road" aria-hidden="true" preserveAspectRatio="none"><path class="todo"/><path class="gone"/></svg>
    <ol id="map" class="map"></ol>
  </div>
</main>

<!-- The songs picked to dance to: album covers peeking out at the bottom left (albums.js, ALBUMS in config.js) -->
<button id="albums" class="albums" type="button">
  <span class="stack"></span>
  <span class="caption"><b></b><span></span></span>
</button>

<!-- The tab on the right edge: opens and closes the side pane -->
<button id="tab" class="tab" type="button" aria-controls="pane" aria-expanded="false"><span aria-hidden="true">📅</span> Days</button>
<div id="shade" class="shade"></div>

<!-- The side pane: the calendar -->
<aside id="pane" class="pane" aria-label="Available days">
  <div class="paneTop">
    <div>
      <p id="hello" class="hello"></p>
      <h2>Available days</h2>
    </div>
    <button id="leave" class="link" type="button" hidden>Not you?</button>
    <button id="paneClose" class="close" type="button" aria-label="Close">✕</button>
  </div>

  <div class="paneBody">
    <!-- Who is on the calendar: a colour, a name and their days in words -->
    <ul id="legend" class="legend"></ul>


    <!-- The months are drawn here -->
    <div id="months"></div>

    <label id="noteBox" class="note">
      <textarea id="note" rows="2" maxlength="500" placeholder="Note (optional)" aria-label="Note (optional)"></textarea>
    </label>
  </div>

  <footer>
    <div id="barIn" class="bar">
      <div class="count"><b id="count">0</b> <span id="countLabel" class="soft">days</span><button id="clear" class="link" type="button">Clear</button></div>
      <button id="send" class="primary" type="button">Send</button>
    </div>
    <p id="sendError" class="error" role="alert"></p>
  </footer>
</aside>

<!-- More about a step (tap a step on the road) -->
<div id="info" class="gate" hidden>
  <div id="infoCard" class="card infoCard"></div>
</div>

<!-- The username -->
<div id="gate" class="gate" hidden>
  <form id="gateForm" class="card" autocomplete="off">
    <h2>Your username</h2>
    <input id="code" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="Your username" aria-label="Your username" enterkeyhint="go" maxlength="31">
    <p id="gateError" class="error" role="alert"></p>
    <button class="primary" type="submit">Continue</button>
    <button id="gateClose" class="link" type="button">Not now</button>
  </form>
</div>

<!-- The organiser's window: hold a Sunday for 5 seconds -->
<div id="read" class="gate" hidden>
  <div class="card infoCard">
    <h2>Organiser</h2>
    <form id="adminForm" class="adminLine" autocomplete="off">
      <input id="adminKey" type="password" placeholder="Organiser key" aria-label="Organiser key">
      <button class="primary" type="submit">Open</button>
    </form>
    <p id="readMsg" class="error" role="status"></p>
    <div id="adminList"></div>
    <form id="adminAdd" class="adminLine" autocomplete="off" hidden>
      <input id="adminName" placeholder="New username" aria-label="New username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="31">
      <button class="primary" type="submit">Add</button>
    </form>
    <button id="readClose" class="link" type="button">Close</button>
  </div>
</div>

<!-- Sent -->
<div id="done" class="gate" hidden>
  <div class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h2>Saved</h2>
    <p id="doneText"></p>
    <button id="again" class="primary" type="button">OK</button>
  </div>
</div>

<script src="/config.js"></script>
<script src="/redirect.js"></script>
<script src="/roadmap/app.js"></script>
<script src="/roadmap/albums.js"></script>
</body>
</html>
